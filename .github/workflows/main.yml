name: Java CI with Maven

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup network & MongoDB container
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t devops-app .

      - name: Run Docker Container
        run: docker run --network se-methods --name devopscontainer devops-app

      - name: View Container Logs
        run: docker logs devopscontainer